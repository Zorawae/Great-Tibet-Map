<html lang="en">

<title>Interactive map of Tibet — Ü-Tsang, Kham and Amdo</title>
<meta name="description" content="Interactive map of the three regions of Tibet: Ü-Tsang, Kham and Amdo. Bilingual labels, area figures and an overlay of present-day borders.">
<link rel="canonical" href="https://zorawae.github.io/Great-Tibet-Map/">
<meta name="theme-color" content="#0B1117">
<meta property="og:type" content="website">

<meta property="og:description" content="An interactive map of the three traditional regions of Tibet. Free, open source, embeddable in any site.">

<style>
  html,body{margin:0;padding:0;background:#080d12;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;}
  @media (max-width:640px){body{padding:0;}}

<body>

<!-- ══════════ COPY FROM HERE ══════════ -->
<div class="tibmap" id="tibet-map"
     data-theme="dark"
     data-labels="both"
     data-admin="false"
     data-cities="true"
     data-inset="true"
     data-selected="">
  <noscript><p style="padding:24px;color:#8FA0AC;font:15px/1.5 system-ui">
    This map needs JavaScript. A static version is available as
    <code>tibet-three-regions.svg</code>.</p></noscript>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Tibetan:wght@400;600&display=swap');

.tibmap{
  /* ── palette: thangka mineral pigments ───────────────────── */
  --tm-utsang:#B23A48;   /* btsod — madder   */
  --tm-kham:#2F6E8F;     /* mthing — azurite */
  --tm-amdo:#3F8F6B;     /* spang — malachite*/
  --tm-gold:#D9A441;     /* gser             */
  --tm-water:#8AD4F5;    /* chu — rivers and lakes */
  --tm-relief:#C2AE86;   /* ri  — range spines     */
  --tm-water-lab:#A8DCF5;  /* label inks, lifted clear of the region fills */
  --tm-relief-lab:#E0CFAC;

  --tm-bg:#0B1117;
  --tm-land:#18222B;
  --tm-land-2:#212C36;
  --tm-hair:#31404B;
  --tm-ink:#EFE7D8;
  --tm-ink-dim:#8FA0AC;
  --tm-rule:#22303A;
  --tm-panel:#101922;
  --tm-scrim:rgba(11,17,23,.82);

  --tm-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --tm-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tm-bo:'Noto Serif Tibetan','Kailasa','Microsoft Himalaya',serif;

  --tm-radius:2px;
  --tm-max:1180px;

  box-sizing:border-box;
  width:100%;
  max-width:var(--tm-max);
  margin:0 auto;
  background:var(--tm-bg);
  color:var(--tm-ink);
  font-family:var(--tm-ui);
  font-size:15px;
  line-height:1.55;
  border:1px solid var(--tm-rule);
  border-radius:var(--tm-radius);
  overflow:hidden;
  container-type:inline-size;
}
.tibmap *,.tibmap *::before,.tibmap *::after{box-sizing:border-box;}

.tibmap[data-theme="light"]{
  --tm-utsang:#A6303F;
  --tm-kham:#2A6182;
  --tm-amdo:#347C5B;
  --tm-gold:#A87A18;
  --tm-water:#12628F;
  --tm-relief:#6E5C3C;
  --tm-water-lab:#0A4664;
  --tm-relief-lab:#4A3A1E;
  --tm-bg:#F7F4EE;
  --tm-land:#E4DFD4;
  --tm-land-2:#D8D2C5;
  --tm-hair:#BDB6A6;
  --tm-ink:#1A1712;
  --tm-ink-dim:#6B6558;
  --tm-rule:#D2CBBC;
  --tm-panel:#FFFDF8;
  --tm-scrim:rgba(255,253,248,.86);
}

/* ── header ──────────────────────────────────────────────── */
.tibmap__head{padding:26px 28px 20px;border-bottom:1px solid var(--tm-rule);}
.tibmap__eyebrow{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tm-gold);margin-bottom:10px;
}
.tibmap__eyebrow b{font-family:var(--tm-bo);font-size:17px;letter-spacing:0;font-weight:400;line-height:1;}
.tibmap__title{
  font-family:var(--tm-display);font-weight:600;
  font-size:clamp(26px,4.4cqw,40px);line-height:1.06;letter-spacing:-.015em;
  margin:0 0 8px;
}
.tibmap__standfirst{margin:0;max-width:62ch;color:var(--tm-ink-dim);font-size:14.5px;}

/* ── signature: the proportion bar / legend / selector ────── */
.tibmap__bar{display:flex;width:100%;margin-top:20px;gap:2px;}
.tibmap__seg{
  appearance:none;border:0;padding:0;cursor:pointer;text-align:left;
  background:transparent;color:inherit;font:inherit;
  display:block;position:relative;
  transition:opacity .25s ease;
}
.tibmap__seg:focus-visible{outline:2px solid var(--tm-gold);outline-offset:3px;}
/* The block keeps a constant 14px box and thickens by painting into it, so
   selecting or hovering a region never reflows the header and nudges the map. */
.tibmap__seg i{
  display:block;height:14px;background:var(--tm-c) top/100% 8px no-repeat;
  transition:background-size .25s ease,filter .25s ease;
}
.tibmap__seg:hover i,.tibmap__seg[aria-pressed="true"] i{background-size:100% 14px;}
.tibmap__seg u{
  display:block;text-decoration:none;padding-top:3px;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tibmap__seg s{
  display:block;text-decoration:none;
  font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--tm-ink-dim);
}
.tibmap[data-active]:not([data-active=""]) .tibmap__seg[aria-pressed="false"]{opacity:.4;}

/* ── body grid ───────────────────────────────────────────── */
.tibmap__body{display:grid;grid-template-columns:minmax(0,1fr) 316px;}
/* The controls are a third grid item, spanning the full width under the map and
   the panel. Once the panel drops below the map they would otherwise be the very
   last thing on the page, a whole panel's worth of scrolling away from the map
   they act on, so `order` lifts them to sit directly beneath it. */
.tibmap__body>.tibmap__foot{grid-column:1/-1;}
@container (max-width:900px){
  .tibmap__body{grid-template-columns:minmax(0,1fr);}
  .tibmap__stage{order:1;}
  .tibmap__body>.tibmap__foot{order:2;}
  .tibmap__panel{order:3;}
}

/* The SVG's own ratio sets the stage's natural height; when the panel beside it
   is taller, the stage stretches and the map fills that height instead of being
   letterboxed. `overflow:visible` lets the SVG paint the land and graticule that
   already exist outside the viewBox into the extra space, so there is never a
   blank band or a hard cut at the map's edge; the stage clips the sideways spill. */
.tibmap__stage{position:relative;background:var(--tm-bg);min-width:0;overflow:hidden;}
.tibmap__svg{display:block;width:100%;height:100%;overflow:visible;}

/* ── zoom and pan ────────────────────────────────────────── */
/* touch-action decides who gets the gesture. At fit zoom there is nothing to
   pan, so one finger scrolls the host page as it always did; once zoomed in,
   one finger pans the map instead. Two fingers always pinch, because the
   browser's own pinch-zoom is off in both states. */
.tibmap__svg{touch-action:pan-y;}
.tibmap[data-zoomed="true"] .tibmap__svg{touch-action:none;cursor:grab;}
.tibmap[data-panning="true"] .tibmap__svg{cursor:grabbing;}
.tibmap__stage:focus-visible{outline:2px solid var(--tm-gold);outline-offset:-2px;}

.tibmap__zoom{
  position:absolute;right:12px;bottom:12px;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.tibmap[data-zoom="false"] .tibmap__zoom{display:none;}
.tibmap__zbtn{
  appearance:none;width:30px;height:30px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--tm-scrim);border:1px solid var(--tm-rule);border-radius:var(--tm-radius);
  color:var(--tm-ink-dim);font:400 17px/1 var(--tm-ui);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tibmap__zbtn:hover:not(:disabled){color:var(--tm-gold);border-color:var(--tm-gold);}
.tibmap__zbtn:focus-visible{outline:2px solid var(--tm-gold);outline-offset:2px;}
.tibmap__zbtn:disabled{opacity:.38;cursor:default;}
.tibmap__zbtn[hidden]{display:none;}
.tibmap__zslot{
  width:30px;height:104px;display:flex;align-items:center;justify-content:center;
  background:var(--tm-scrim);border:1px solid var(--tm-rule);border-radius:var(--tm-radius);
}
/* A vertical range input is still not portable, so the slider is a horizontal
   one turned on its side -- which keeps the native control, and its keyboard. */
.tibmap__zrange{
  appearance:none;-webkit-appearance:none;background:transparent;
  width:92px;height:14px;margin:0;transform:rotate(-90deg);cursor:pointer;
}
.tibmap__zrange::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--tm-hair);}
.tibmap__zrange::-moz-range-track{height:3px;border-radius:2px;background:var(--tm-hair);}
.tibmap__zrange::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4px;
  border:0;border-radius:50%;background:var(--tm-gold);
}
.tibmap__zrange::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--tm-gold);}
.tibmap__zrange:focus-visible{outline:2px solid var(--tm-gold);outline-offset:3px;}
@container (max-width:760px){
  .tibmap__zoom{right:8px;bottom:8px;gap:5px;}
  .tibmap__zslot{height:84px;}
  .tibmap__zrange{width:74px;}
}

/* ── map layers ──────────────────────────────────────────── */
.tibmap .tm-sea{fill:var(--tm-bg);}
.tibmap .tm-grat{fill:none;stroke:var(--tm-hair);stroke-width:.6;opacity:.35;}
.tibmap .tm-neigh{fill:var(--tm-land);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-china{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-neighline{fill:none;stroke:var(--tm-hair);stroke-width:1;}
.tibmap .tm-admin{fill:none;stroke:var(--tm-ink);stroke-opacity:.42;stroke-width:1.4;stroke-dasharray:7 5;}
.tibmap .tm-outline{fill:none;stroke:var(--tm-gold);stroke-width:2.4;stroke-linejoin:round;pointer-events:none;}
.tibmap .tm-regions{filter:url(#tmLift);}
.tibmap .tm-halo{fill:none;stroke:var(--tm-bg);stroke-width:9;stroke-linejoin:round;opacity:.85;pointer-events:none;}

.tibmap .tm-region{
  stroke:var(--tm-bg);stroke-width:1.2;stroke-linejoin:round;
  cursor:pointer;
  transition:filter .3s ease,opacity .3s ease;
}
.tibmap .tm-region:focus{outline:none;}
.tibmap .tm-region:focus-visible{stroke:var(--tm-gold);stroke-width:3;}
.tibmap .tm-utsang{fill:var(--tm-utsang);}
.tibmap .tm-kham{fill:var(--tm-kham);}
.tibmap .tm-amdo{fill:var(--tm-amdo);}
.tibmap .tm-tex{pointer-events:none;}

.tibmap[data-active]:not([data-active=""]) .tm-region:not(.is-on){opacity:.34;filter:saturate(.45);}
.tibmap .tm-region.is-on{filter:brightness(1.16);}

/* map typography */
.tibmap .tm-ctry{
  fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-weight:500;
  letter-spacing:.2em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:4px;
}
.tibmap .tm-k-C{font-size:21px;letter-spacing:.26em;opacity:.95;font-weight:600;}
.tibmap .tm-k-c{font-size:14px;opacity:.75;}
.tibmap .tm-k-p{font-size:15px;opacity:.6;font-style:italic;letter-spacing:.1em;
  font-family:var(--tm-display);text-transform:none;}
.tibmap .tm-rname{
  fill:var(--tm-ink);font-family:var(--tm-display);font-weight:600;font-size:34px;
  letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(0,0,0,.32);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rname{stroke:rgba(255,255,255,.45);}
.tibmap .tm-rbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:27px;text-anchor:middle;
  pointer-events:none;opacity:.9;
  paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rbo{stroke:rgba(255,255,255,.45);}
.tibmap .tm-city{fill:var(--tm-ink);}
.tibmap .tm-cityring{fill:none;stroke:var(--tm-ink);stroke-opacity:.55;}
.tibmap .tm-cname{
  fill:var(--tm-ink);font-family:var(--tm-ui);font-size:16px;font-weight:500;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.75;stroke-width:4px;
}
.tibmap .tm-cbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:14px;opacity:.72;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:3.5px;
}
.tibmap[data-cities="false"] .tm-cities{display:none;}
.tibmap[data-admin="false"] .tm-adminlayer{display:none;}
.tibmap[data-labels="en"] .tm-bo-only{display:none;}
.tibmap[data-labels="bo"] .tm-en-only{display:none;}

/* ── panel ───────────────────────────────────────────────── */
.tibmap__panel{
  border-left:1px solid var(--tm-rule);background:var(--tm-panel);min-width:0;
}
/* --tm-panel-h is measured at runtime as the tallest of the four panels, so
   moving between regions never changes the widget's height. */
.tibmap__pbody{
  padding:24px 24px 22px;display:flex;flex-direction:column;gap:16px;
  min-height:var(--tm-panel-h,0px);
}
@container (max-width:900px){ .tibmap__panel{border-left:0;border-top:1px solid var(--tm-rule);} }

.tibmap__mark{width:34px;height:3px;background:var(--tm-c,var(--tm-gold));}
.tibmap__pname{font-family:var(--tm-display);font-size:27px;font-weight:600;line-height:1.1;margin:0;}
.tibmap__pbo{font-family:var(--tm-bo);font-size:20px;line-height:1.9;margin:2px 0 0;color:var(--tm-gold);}
.tibmap__pkicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tm-ink-dim);margin:0;
}
.tibmap__pdesc{margin:0;font-size:14px;color:var(--tm-ink);opacity:.88;}
.tibmap__facts{margin:0;padding:0;list-style:none;border-top:1px solid var(--tm-rule);}
.tibmap__facts li{
  display:flex;justify-content:space-between;gap:14px;
  padding:8px 0;border-bottom:1px solid var(--tm-rule);font-size:13px;
}
.tibmap__facts dt,.tibmap__facts span:first-child{color:var(--tm-ink-dim);letter-spacing:.04em;}
.tibmap__facts span:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.tibmap__quote{
  margin:0;padding:14px 0 0;border-top:1px solid var(--tm-rule);
  font-family:var(--tm-display);font-size:15px;line-height:1.45;color:var(--tm-ink);opacity:.9;
}
.tibmap__quote cite{display:block;margin-top:7px;font:400 11px/1.4 var(--tm-ui);
  letter-spacing:.16em;text-transform:uppercase;color:var(--tm-ink-dim);font-style:normal;}

/* ── controls + note ─────────────────────────────────────── */
.tibmap__foot{
  border-top:1px solid var(--tm-rule);padding:14px 28px 20px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;
}
.tibmap__ctrl{
  appearance:none;background:transparent;border:1px solid var(--tm-rule);
  color:var(--tm-ink-dim);font:500 11px/1 var(--tm-ui);letter-spacing:.14em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--tm-radius);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tibmap__ctrl:hover{color:var(--tm-ink);border-color:var(--tm-hair);}
.tibmap__ctrl[aria-pressed="true"],
.tibmap__ctrl[data-on="true"]{color:var(--tm-gold);border-color:var(--tm-gold);}
.tibmap__ctrl:focus-visible{outline:2px solid var(--tm-gold);outline-offset:2px;}
.tibmap__note{
  padding:0 28px 24px;margin:0;font-size:11.5px;line-height:1.65;
  color:var(--tm-ink-dim);max-width:88ch;
}
.tibmap__note b{color:var(--tm-ink);font-weight:500;}

.tibmap .tm-inset-frame{fill:var(--tm-bg);stroke:var(--tm-rule);stroke-width:1.5;}
.tibmap .tm-inset-world{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:.5;}
.tibmap .tm-inset-tib{fill:var(--tm-gold);stroke:var(--tm-gold);stroke-width:1.6;stroke-linejoin:round;}
.tibmap .tm-inset-ring{fill:none;stroke:var(--tm-gold);stroke-width:1.2;opacity:.85;}
.tibmap .tm-inset-cap{fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;}
.tibmap[data-inset="false"] .tm-insetlayer{display:none;}

.tibmap__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* ── small containers: bigger map type, less clutter ─────── */
@container (max-width:760px){
  .tibmap__head{padding:20px 18px 16px;}
  .tibmap__foot{padding:12px 18px 16px;gap:8px 14px;}
  .tibmap__note{padding:0 18px 20px;}
  .tibmap__pbody{padding:20px 18px;}
  .tibmap__seg s{display:none;}
  .tibmap__seg u{font-size:10.5px;letter-spacing:.1em;}
  .tibmap .tm-rname{font-size:60px;stroke-width:7px;}
  .tibmap .tm-rbo{font-size:50px;stroke-width:7px;}
  .tibmap .tm-k-C{font-size:30px;letter-spacing:.16em;}
  .tibmap .tm-k-c{display:none;}
  .tibmap .tm-cname{font-size:31px;stroke-width:6px;}
  .tibmap .tm-hylab{font-size:24px;stroke-width:7px;}
  .tibmap .tm-rglab{font-size:20px;stroke-width:7px;letter-spacing:.05em;}
  .tibmap .tm-pklab{font-size:19px;stroke-width:7px;}
  .tibmap .tm-insetlayer{display:none;}
  .tibmap .tm-city{r:6;}
  .tibmap .tm-cityring{r:13;stroke-width:2;}
  .tibmap .tm-cityitem[data-key="0"]{display:none;}
  .tibmap .tm-cbo{display:none;}
  .tibmap .tm-k-p{display:none;}
  .tibmap .tm-rbo{transform:translateY(26px);}
  .tibmap .tm-region{stroke-width:2;}
  .tibmap .tm-outline{stroke-width:3.4;}
  .tibmap .tm-admin{stroke-width:2.4;stroke-dasharray:11 8;}
}
/* Physical geography. Both layers are off by default: the map is about the
   three regions first, and rivers and ranges are context you opt into. */
.tibmap .tm-hydro,.tibmap .tm-relief{display:none;}
.tibmap[data-rivers="true"] .tm-hydro{display:block;}
.tibmap[data-ranges="true"] .tm-relief{display:block;}
/* The region fills are left at full strength: fading them made the plateau
   read as a different shape, which is not a trade worth making for contrast.
   The water carries its own instead. */
/* The region titles are left exactly as the map draws them. Fading them and
   sliding "Kham" aside made room for the gang names, but both changed how the
   map itself looks, which is not this layer's to do: a name that has to give
   way is the crest name, not the region's. */
.tibmap .tm-river{fill:none;stroke:var(--tm-water);stroke-width:1.2;opacity:.92;
  stroke-linecap:round;stroke-linejoin:round;}
.tibmap .tm-river.is-main{stroke-width:1.9;}
.tibmap .tm-lake{fill:var(--tm-water);fill-opacity:.8;stroke:var(--tm-water);stroke-width:.8;}
/* A crest line, thin and solid. It is deliberately not dashed: the map already
   uses dashes for present-day borders, and a wide soft band just read as a
   smudge over the land. */
.tibmap .tm-range.is-out{opacity:.22;}
.tibmap .tm-range{fill:none;stroke:var(--tm-relief);stroke-width:1.4;opacity:.6;
  stroke-linecap:round;stroke-linejoin:round;}
.tibmap .tm-peak{fill:var(--tm-relief);opacity:.9;}
.tibmap .tm-lead{stroke:var(--tm-relief-lab);stroke-width:.8;opacity:.5;}
.tibmap .tm-lead.is-water{stroke:var(--tm-water-lab);}
.tibmap .tm-hylab{fill:var(--tm-water-lab);font-family:var(--tm-ui);font-size:13.5px;
  font-style:italic;letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.88;stroke-width:4.5px;
  stroke-linejoin:round;}
.tibmap .tm-rglab{fill:var(--tm-relief-lab);font-family:var(--tm-ui);font-size:11.5px;
  font-weight:500;letter-spacing:.06em;text-anchor:middle;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.88;
  stroke-width:4.5px;stroke-linejoin:round;}
.tibmap .tm-hybo,.tibmap .tm-rgbo,.tibmap .tm-pkbo{
  font-family:var(--tm-bo);letter-spacing:0;text-transform:none;font-style:normal;}
/* The Tibetan name sits a line below the Latin one, and moves up into its place
   when the Latin one is hidden. This rides on the wrapping .tm-boslot group and
   never on the <text>, so the run keeps its Tibetan shaping -- see bilabel(). */

  /* Two names per feature, Latin and Tibetan, hidden by the Labels toggle the
     same way the town names are. A feature with no Tibetan yet keeps its Latin
     name in every mode rather than vanishing when the map is set to Tibetan. */
  /* One language per mode, with no exceptions: the Latin name is always
     tagged tm-en-only, so Tibetan mode shows Tibetan and nothing else. A
     feature with no Tibetan name yet is therefore unlabelled in that mode
     rather than falling back to Latin and mixing the two. */
  /* Nothing positional ever goes on the <text> itself -- no x, y, dx, dy, and no
     CSS transform either. Those are SVG's per-character text-positioning
     attributes, and a run carrying them is laid out character by character, which
     discards the OpenType shaping Tibetan depends on: subjoined letters stop
     stacking under their base, and vowel signs detach and land on the baseline
     beside it instead of above or below. Blink absorbs that and shapes the run
     anyway, WebKit does not -- so these labels were correct in every desktop
     browser, phone emulation included (still Blink), and came apart only on real
     iPhones and iPads.

     The vertical offset therefore rides on wrapping <g> elements, where it is an
     ordinary transform and cannot reach the text run. Two of them, because a CSS
     transform REPLACES a transform attribute on the same element rather than
     composing with it: the outer <g> carries the slot offset as an attribute and
     the inner one the Tibetan-mode nudge as CSS, so they compose instead of one
     wiping out the other. */
  function bilabel(cls, boCls, feat, txtEn, txtBo, place, dy){
    var slot='<g transform="translate(0,'+Number(dy)+')">';
    var out='<g '+place+' data-feat="'+esc(feat)+'">'+
      slot+'<text class="'+cls+' tm-en-only">'+esc(txtEn)+'</text></g>';
    if(txtBo) out+=slot+'<g class="tm-boslot"><text class="'+boCls+
      ' tm-bo-only">'+txtBo+'</text></g></g>';
    return out+'</g>';
  }

  /* A connector ties a name back to the line it belongs to.  Whether one is
     drawn is settled at build time and carried in DATA as `lead` -- see
     mark_connectors() in tools/build-physical.py, which asks whether the name
     is nearer somebody else's feature than its own rather than how far it has
     travelled.  Nothing is decided here: this only draws it.

     The tick rides in the same rotated frame the name is placed in, so it runs
     along the perpendicular the name was pushed out on.  The name's box is
     LEAD_H tall and sits 0.3 of that above the baseline at the anchor, so it
     spans dy-0.8*LEAD_H to dy+0.2*LEAD_H; the tick stops LEAD_GAP short of
     whichever of those edges faces the line. */
  var LEAD_H=14, LEAD_GAP=2;
  function connector(f, cls){
    if(!f.lead||!f.lab) return '';
    var dy=Number(f.dy),
        end=dy>0 ? dy-0.8*LEAD_H-LEAD_GAP : dy+0.2*LEAD_H+LEAD_GAP;
    return '<g transform="translate('+f.lab.p[0]+','+f.lab.p[1]+') rotate('+f.lab.a+')">'+
      '<line class="'+cls+'" x1="0" y1="0" x2="0" y2="'+end.toFixed(1)+'"/></g>';
  }

  /* A lake's name stands beside its water rather than on it: none of the five

    '</g>';
  })();

  function hatch(id,angle,color){
    return '<pattern id="'+id+'" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate('+angle+')">'+
      '<line x1="0" y1="0" x2="0" y2="7" stroke="'+color+'" stroke-width="2.2"/></pattern>';
  }

  root.innerHTML =
  '<div class="tibmap__head">'+
    '<div class="tibmap__eyebrow"><b>ཆོལ་ཁ་གསུམ།</b><span>Chöl-kha-sum · the three regions</span></div>'+
    '<h2 class="tibmap__title">Ü-Tsang, Kham and Amdo</h2>'+
    '<p class="tibmap__standfirst">The three traditional regions of Tibet, shown against the modern map. Choose a region to read about it; the bar below is scaled to each one\u2019s share of the total area.</p>'+
    '<div class="tibmap__bar" role="group" aria-label="Select a region">'+segs+'</div>'+
  '</div>'+
  '<div class="tibmap__body">'+
    '<div class="tibmap__stage" tabindex="0" aria-label="Map. Zoom with plus and minus, pan with the arrow keys, 0 resets.">'+
      '<svg class="tibmap__svg" viewBox="'+DATA.viewBox+'" role="img" aria-label="Map of the three traditional regions of Tibet: Ü-Tsang, Kham and Amdo" preserveAspectRatio="xMidYMid meet">'+
      '<defs>'+
        hatch('tmTex-utsang',45,'rgba(255,255,255,.05)')+
        hatch('tmTex-kham',-45,'rgba(255,255,255,.055)')+
        hatch('tmTex-amdo',90,'rgba(255,255,255,.05)')+
        '<clipPath id="tmTibet"><path d="'+DATA.outline+'"/></clipPath>'+
        '<filter id="tmLift" x="-12%" y="-12%" width="124%" height="124%">'+
          '<feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>'+
        '</filter>'+
      '</defs>'+
      '<rect class="tm-sea" x="0" y="0" width="'+W+'" height="'+H+'"/>'+
      '<g class="tm-zoom">'+
      '<path class="tm-grat" d="'+DATA.graticule+'"/>'+
      '<path class="tm-neigh" d="'+DATA.neighbours+'"/>'+
      '<path class="tm-china" d="'+DATA.chinaRest+'"/>'+
      DATA.neighbourLines.map(function(d){return '<path class="tm-neighline" d="'+d+'"/>';}).join('')+
      '<path class="tm-halo" d="'+DATA.outline+'"/>'+
      '<g class="tm-regions">'+regionPaths+'</g>'+
      '<path class="tm-outline" d="'+DATA.outline+'"/>'+
      '<g class="tm-hydro"><g clip-path="url(#tmTibet)">'+hydroArt+'</g></g>'+
      '<g class="tm-relief">'+reliefArt+'<g clip-path="url(#tmTibet)">'+reliefIn+'</g></g>'+
      '<g class="tm-adminlayer">'+DATA.adminLines.map(function(d){return '<path class="tm-admin" d="'+d+'"/>';}).join('')+'</g>'+
      '<g class="tm-ctrys">'+ctry+'</g>'+
      '<g class="tm-names">'+regionNames+'</g>'+
      /* The feature names go above the region titles. Mardza gang's crest runs
         under where "Kham" is written and no position along it is clear, so one
         of the two has to sit on top; the small name carries a halo and stays
         readable over the large one, which the reverse does not. */
      '<g class="tm-hydro">'+hydroLead+hydroLab+'</g>'+
      '<g class="tm-relief">'+reliefLead+reliefLab+'</g>'+
      '<g class="tm-cities">'+cities+'</g>'+
      '</g>'+
      inset+
      '</svg>'+
      '<div class="tibmap__zoom" role="group" aria-label="Zoom">'+
        '<button class="tibmap__zbtn" type="button" data-zact="in" aria-label="Zoom in" title="Zoom in">+</button>'+
        '<div class="tibmap__zslot">'+
          '<input class="tibmap__zrange" type="range" min="0" max="100" step="1" value="0" aria-label="Zoom level">'+
        '</div>'+
        '<button class="tibmap__zbtn" type="button" data-zact="out" aria-label="Zoom out" title="Zoom out" disabled>\u2212</button>'+
        '<button class="tibmap__zbtn" type="button" data-zact="reset" aria-label="Reset zoom" title="Reset zoom" hidden>\u21ba</button>'+
      '</div>'+
    '</div>'+
    '<aside class="tibmap__panel" id="tibmap-panel" aria-live="polite"><div class="tibmap__pbody"></div></aside>'+
    '<div class="tibmap__foot">'+
      '<button class="tibmap__ctrl" type="button" data-act="labels">Labels: Both</button>'+
      '<button class="tibmap__ctrl" type="button" data-act="admin" aria-pressed="false">Current borders</button>'+
      '<button class="tibmap__ctrl" type="button" data-act="cities" aria-pressed="true">Towns</button>'+
      '<button class="tibmap__ctrl" type="button" data-act="inset" aria-pressed="true">Locator</button>'+'<button class="tibmap__ctrl" type="button" data-act="theme">Light</button>'+
      '<button class="tibmap__ctrl" type="button" data-act="physical">Physical: Off</button>'+
    '</div>'+
  '</div>'+
  '<p class="tibmap__note">Historically Tibet was divided into three cultural regions called \u00dc-Tsang, Kham and Amdo. Each one of these three regions has developed its own distinct dialect of Tibetan. Most widely spoken is the Lhasa dialect, also called Standard Tibetan, which is spoken in Central Tibet and also in Exile by most Tibetans. In Kham the Khams Tibetan dialect is spoken and in Amdo the Amdo Tibetan dialect. The Tibetan dialects are subject to the Tibetic languages which are part of the Tibeto-Burman languages. Modern Tibetan derives from Classical Tibetan, which is the written norm, and from Old Tibetan. The official language of Bhutan, Dzongkha, is also closely related to Tibetan.</p>';

  /* ── behaviour ──────────────────────────────────────── */
  var panel=root.querySelector('.tibmap__pbody');
  var listeners=[];
  var LABEL_MODES=['both','en','bo'], LABEL_TEXT={both:'Both',en:'English',bo:'Tibetan'};

  /* Rivers and ranges are one cycling control, but they stay two independent
     data attributes: data-rivers and data-ranges are the documented embedding
     API, and CSS keys off them separately. The button reads its mode back out
     of them, so a host that sets either attribute by hand still gets a button
     that reports the truth. */
  var PHYS_MODES=['off','rivers','ranges','both'],
      PHYS_TEXT={off:'Off',rivers:'Rivers',ranges:'Ranges',both:'Both'};

  function physMode(){
    var r=root.getAttribute('data-rivers')==='true',
        g=root.getAttribute('data-ranges')==='true';
    return r&&g?'both':r?'rivers':g?'ranges':'off';
  }
  function setPhys(m){
    root.setAttribute('data-rivers', m==='rivers'||m==='both');
    root.setAttribute('data-ranges', m==='ranges'||m==='both');
    var b=root.querySelector('[data-act="physical"]');
    b.textContent='Physical: '+PHYS_TEXT[m];
    b.setAttribute('data-on', m!=='off');
  }

  function panelHTML(k){
    if(!k){
      return ''+
        '<div class="tibmap__mark" style="--tm-c:var(--tm-gold)"></div>'+
        '<p class="tibmap__pkicker">Chöl-kha-sum</p>'+
        '<h3 class="tibmap__pname">Three regions, one plateau</h3>'+
        '<p class="tibmap__pdesc">Tibetans have long described their country in three parts, each with its own dialect, landscape and reputation. Select a region on the map or in the bar above.</p>'+
        '<ul class="tibmap__facts">'+
          '<li><span>Combined area</span><span>'+fmt(total)+' km²</span></li>'+
          '<li><span>Mean elevation</span><span>≈ 4,500 m</span></li>'+
          '<li><span>Regions shown</span><span>3</span></li>'+
        '</ul>'+
        '<blockquote class="tibmap__quote">The best religion from Ü-Tsang, the best men from Kham, the best horses from Amdo.<cite>Tibetan saying</cite></blockquote>';
    }
    var r=REGIONS[k], d=DATA.regions[k];
    return ''+
      '<div class="tibmap__mark" style="--tm-c:var(--tm-'+k+')"></div>'+
      '<div>'+
        '<p class="tibmap__pkicker">'+r.kicker+'</p>'+
        '<h3 class="tibmap__pname">'+r.name+'</h3>'+
        '<p class="tibmap__pbo">'+r.bo+'</p>'+
      '</div>'+
      '<p class="tibmap__pdesc">'+r.desc+'</p>'+
      '<ul class="tibmap__facts">'+
        '<li><span>Area</span><span>'+fmt(d.areaKm2)+' km²</span></li>'+
        '<li><span>Share of Tibet</span><span>'+(d.areaKm2/total*100).toFixed(1)+'%</span></li>'+
        r.facts.map(function(f){return '<li><span>'+f[0]+'</span><span>'+f[1]+'</span></li>';}).join('')+
        '<li><span>Today</span><span>'+r.today+'</span></li>'+
      '</ul>';
  }

  function renderPanel(k){ panel.innerHTML=panelHTML(k); }

  /* Reserve the height of the tallest panel. Without it the panel — the taller
     of the two grid cells — resizes the row every time the region changes,
     which letterboxes the map and resizes any frame embedding the widget.
     Re-measured only when the panel's width changes, so it cannot loop. */
  var reservedFor=-1;
  function reservePanel(){
    var w=panel.clientWidth;
    if(w===reservedFor||!w) return;
    reservedFor=w;
    var cur=root.getAttribute('data-selected')||'', tallest=0, live=panel.parentNode;
    live.setAttribute('aria-live','off');   /* do not announce the measuring */
    root.style.setProperty('--tm-panel-h','0px');
    [''].concat(ORDER).forEach(function(k){
      renderPanel(k);
      tallest=Math.max(tallest,panel.getBoundingClientRect().height);
    });
    renderPanel(cur);
    root.style.setProperty('--tm-panel-h',Math.ceil(tallest)+'px');
    live.setAttribute('aria-live','polite');
  }

  function select(k){
    if(k && !REGIONS[k]) return;
    root.setAttribute('data-active',k||'');
    root.setAttribute('data-selected',k||'');
    ORDER.forEach(function(id){
      var on=id===k;
      root.querySelectorAll('[data-region="'+id+'"]').forEach(function(el){
        el.setAttribute('aria-pressed',on?'true':'false');
        el.classList.toggle('is-on',on);
      });
    });
    renderPanel(k);
    listeners.forEach(function(fn){try{fn(k||null);}catch(e){}});
  }

  /* ── zoom and pan ────────────────────────────────────
     The map is moved by a transform on one <g> rather than by rewriting the
     viewBox, so the sea rect and the locator inset can stay outside it: the
     background is always painted and the inset stays pinned to its corner.
     getScreenCTM() does the screen-to-user conversion, which keeps the
     arithmetic right whatever preserveAspectRatio does with a stage taller
     than the map itself. */
  var Z_MIN=1, Z_MAX=8, Z_STEP=1.5;
  var stage=root.querySelector('.tibmap__stage'),
      svg=root.querySelector('.tibmap__svg'),
      zg=root.querySelector('.tm-zoom'),
      zui=root.querySelector('.tibmap__zoom'),
      zrange=zui.querySelector('.tibmap__zrange'),
      zbtn={};
  zui.querySelectorAll('[data-zact]').forEach(function(b){ zbtn[b.getAttribute('data-zact')]=b; });

  var zk=1, zx=0, zy=0, fromSlider=false;
  function zoomOff(){ return root.getAttribute('data-zoom')==='false'; }
  function r3(n){ return Math.round(n*1000)/1000; }
  function kToSlider(k){ return Math.round(100*Math.log(k/Z_MIN)/Math.log(Z_MAX/Z_MIN)); }
  function sliderToK(v){ return Z_MIN*Math.pow(Z_MAX/Z_MIN, v/100); }

  function zApply(){
    /* Never let the map be dragged off its own frame: the content, scaled,
       must still cover the viewBox in both axes. At fit zoom that pins it. */
    if(zk<=Z_MIN){ zk=Z_MIN; zx=0; zy=0; }
    else {
      zx=Math.min(0,Math.max(W*(1-zk),zx));
      zy=Math.min(0,Math.max(H*(1-zk),zy));
    }
    zg.setAttribute('transform','translate('+r3(zx)+','+r3(zy)+') scale('+r3(zk)+')');
    root.setAttribute('data-zoomed', zk>Z_MIN?'true':'false');
    if(!fromSlider) zrange.value=kToSlider(zk);
    zrange.setAttribute('aria-valuetext', (Math.round(zk*10)/10)+'×');
    zbtn['in'].disabled = zk>=Z_MAX-1e-6;
    zbtn['out'].disabled = zk<=Z_MIN+1e-6;
    zbtn['reset'].hidden = zk<=Z_MIN+1e-6;
  }

  function ptToUser(cx,cy){
    var m=svg.getScreenCTM();
    if(!m) return {x:W/2,y:H/2};
    m=m.inverse();
    return {x:m.a*cx+m.c*cy+m.e, y:m.b*cx+m.d*cy+m.f};
  }

  /* Hold the user-space point (ux,uy) still while the scale changes, so the
     map grows about the pointer rather than about the middle. */
  function zoomTo(k2,ux,uy){
    k2=Math.min(Z_MAX,Math.max(Z_MIN,k2));
    if(ux==null){ ux=W/2; uy=H/2; }
    zx=ux-(k2/zk)*(ux-zx);
    zy=uy-(k2/zk)*(uy-zy);
    zk=k2;
    zApply();
  }

  zui.addEventListener('click',function(e){
    var b=e.target.closest('[data-zact]'); if(!b) return;
    var a=b.getAttribute('data-zact');
    zoomTo(a==='in'?zk*Z_STEP : a==='out'?zk/Z_STEP : Z_MIN);
  });
  zrange.addEventListener('input',function(){
    fromSlider=true; zoomTo(sliderToK(+zrange.value)); fromSlider=false;
  });

  /* Pointer bookkeeping: one pointer pans, two pinch. */
  var ptrs={}, nPtr=0, armed=false, dragging=false, moved=0,
      pinchD=0, pinchK=1, swallowClick=false;
  function ptrList(){ var a=[]; for(var id in ptrs) a.push(ptrs[id]); return a; }
  function pinchGap(){ var a=ptrList(); return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  function pinchMid(){ var a=ptrList(); return {x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2}; }

  svg.addEventListener('pointerdown',function(e){
    if(zoomOff()) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    if(!(e.pointerId in ptrs)) nPtr++;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    swallowClick=false;
    if(nPtr===1){
      /* On touch at fit zoom the page keeps its scroll; there is nothing to
         pan to anyway. A mouse may always drag. */
      armed=(e.pointerType!=='touch'||zk>Z_MIN); dragging=false; moved=0;
    } else if(nPtr===2){
      armed=false; dragging=false; root.setAttribute('data-panning','false');
      pinchD=pinchGap(); pinchK=zk;
    }
  });

  svg.addEventListener('pointermove',function(e){
    if(zoomOff()||!(e.pointerId in ptrs)) return;
    var prev=ptrs[e.pointerId];
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(nPtr>=2){
      if(pinchD>0){
        var mid=pinchMid(), u=ptToUser(mid.x,mid.y);
        zoomTo(pinchK*(pinchGap()/pinchD), u.x, u.y);
      }
      e.preventDefault(); return;
    }
    if(!armed) return;
    var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    moved+=Math.abs(dx)+Math.abs(dy);
    /* Only now is it a drag rather than a click, so only now take the pointer:
       capturing earlier would retarget the click away from the region under it. */
    if(!dragging){
      if(moved<=3) return;
      dragging=true;
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      root.setAttribute('data-panning','true');
    }
    var m=svg.getScreenCTM();
    if(m&&m.a){ zx+=dx/m.a; zy+=dy/m.d; zApply(); }
    e.preventDefault();
  });

  function endPtr(e){
    if(!(e.pointerId in ptrs)) return;
    delete ptrs[e.pointerId]; nPtr=Math.max(0,nPtr-1);
    if(nPtr<2) pinchD=0;
    if(nPtr===0){
      if(dragging) swallowClick=true;   /* a drag is not a click on a region */
      armed=false; dragging=false; root.setAttribute('data-panning','false');
    }
  }
  svg.addEventListener('click',function(e){
    if(swallowClick){ swallowClick=false; e.stopPropagation(); }
  },true);
  svg.addEventListener('pointerup',endPtr);
  svg.addEventListener('pointercancel',endPtr);

  /* A plain wheel keeps scrolling the host page -- a map that swallows the
     scroll of the page it is embedded in is a nuisance. Ctrl or Cmd zooms,
     which is also what a trackpad pinch sends. */
  svg.addEventListener('wheel',function(e){
    if(zoomOff()||!(e.ctrlKey||e.metaKey)) return;
    e.preventDefault();
    var u=ptToUser(e.clientX,e.clientY);
    zoomTo(zk*Math.pow(0.9985,e.deltaY), u.x, u.y);
  },{passive:false});

  svg.addEventListener('dblclick',function(e){
    if(zoomOff()) return;
    var u=ptToUser(e.clientX,e.clientY);
    zoomTo(zk*1.8,u.x,u.y);
    e.preventDefault();
  });

  stage.addEventListener('keydown',function(e){
    if(zoomOff()||e.target!==stage) return;
    var step=48/zk;
    switch(e.key){
      case '+': case '=': zoomTo(zk*Z_STEP); break;
      case '-': case '_': zoomTo(zk/Z_STEP); break;
      case '0': zoomTo(Z_MIN); break;
      case 'ArrowLeft':  zx+=step; zApply(); break;
      case 'ArrowRight': zx-=step; zApply(); break;
      case 'ArrowUp':    zy+=step; zApply(); break;
      case 'ArrowDown':  zy-=step; zApply(); break;
      default: return;
    }
    e.preventDefault();
  });

  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-region]');
    if(t){ var k=t.getAttribute('data-region');
      select(root.getAttribute('data-selected')===k?'':k); return; }
    var c=e.target.closest('[data-act]');
    if(!c) return;
    var a=c.getAttribute('data-act');
    if(a==='physical'){ setPhys(PHYS_MODES[(PHYS_MODES.indexOf(physMode())+1)%PHYS_MODES.length]); }
    if(a==='admin'){ var on=root.getAttribute('data-admin')!=='true';
      root.setAttribute('data-admin',on); c.setAttribute('aria-pressed',on); }
    if(a==='cities'){ var on2=root.getAttribute('data-cities')!=='true';
      root.setAttribute('data-cities',on2); c.setAttribute('aria-pressed',on2); }
    if(a==='inset'){ var on3=root.getAttribute('data-inset')!=='true';
      root.setAttribute('data-inset',on3); c.setAttribute('aria-pressed',on3); }
    if(a==='labels'){ var cur=root.getAttribute('data-labels')||'both';
      var nx=LABEL_MODES[(LABEL_MODES.indexOf(cur)+1)%3];
      root.setAttribute('data-labels',nx); c.textContent='Labels: '+LABEL_TEXT[nx]; }
    if(a==='theme'){ var lt=root.getAttribute('data-theme')!=='light';
      root.setAttribute('data-theme',lt?'light':'dark'); c.textContent=lt?'Dark':'Light'; }
  });

  root.addEventListener('keydown',function(e){
    var t=e.target.closest('.tm-region'); if(!t) return;
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); t.click(); }
  });

  var hoverTimer;
  root.querySelectorAll('.tm-region').forEach(function(p){
    p.addEventListener('mouseenter',function(){
      if(root.getAttribute('data-selected')) return;
      clearTimeout(hoverTimer);
      root.setAttribute('data-active',p.getAttribute('data-region'));
      p.classList.add('is-on');
      renderPanel(p.getAttribute('data-region'));
    });
    p.addEventListener('mouseleave',function(){
      if(root.getAttribute('data-selected')) return;
      p.classList.remove('is-on');
      hoverTimer=setTimeout(function(){
        if(!root.getAttribute('data-selected')){root.setAttribute('data-active','');renderPanel('');}
      },90);
    });
  });

  if(root.getAttribute('data-theme')==='auto'){
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    var apply=function(){root.setAttribute('data-theme',mq.matches?'light':'dark');};
    apply(); mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
  }
  if(!root.hasAttribute('data-inset')) root.setAttribute('data-inset','true');
  root.querySelector('[data-act="inset"]').setAttribute('aria-pressed',root.getAttribute('data-inset')!=='false');
  root.querySelector('[data-act="admin"]').setAttribute('aria-pressed',root.getAttribute('data-admin')==='true');
  root.querySelector('[data-act="cities"]').setAttribute('aria-pressed',root.getAttribute('data-cities')!=='false');
  root.querySelector('[data-act="labels"]').textContent='Labels: '+(LABEL_TEXT[root.getAttribute('data-labels')]||'Both');
  setPhys(physMode());
  zApply();
  reservePanel();
  select(root.getAttribute('data-selected')||'');

  if(window.ResizeObserver) new ResizeObserver(reservePanel).observe(root);
  else window.addEventListener('resize',reservePanel);
  /* Web fonts change the text metrics, so measure again once they are in. */
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(function(){reservedFor=-1;reservePanel();});
  }

  window.TibetMap={
    select:select,
    get:function(){return root.getAttribute('data-selected')||null;},
    on:function(fn){listeners.push(fn);return this;},
    setTheme:function(t){root.setAttribute('data-theme',t);},
    setZoom:function(k){zoomTo(+k);return this;},
    getZoom:function(){return zk;},
    resetView:function(){zoomTo(Z_MIN);return this;},
    regions:REGIONS,
    data:DATA
  };
})();
</script>

<script>
/* Report our height to a parent page, so an embedding iframe can size itself.
   Not part of the widget — safe to drop when pasting the block above inline. */
if (window.parent !== window && window.ResizeObserver) {
  new ResizeObserver(function () {
    parent.postMessage({ tibmapHeight: document.body.scrollHeight }, '*');
  }).observe(document.body);
}
</script>

</body>
