.tibmap{
  /* ── palette: thangka mineral pigments ───────────────────── */
  --tm-utsang:#B23A48;   /* btsod — madder   */
  --tm-kham:#2F6E8F;     /* mthing — azurite */
  --tm-amdo:#3F8F6B;     /* spang — malachite*/
  --tm-gold:#D9A441;     /* gser             */
  --tm-water:#8AD4F5;    /* chu — rivers and lakes */
  --tm-relief:#C2AE86;   /* ri  — range spines     */
  --tm-water-lab:#A8DCF5;  /* label inks, lifted clear of the region fills */
  --tm-relief-lab:#E0CFAC;

  --tm-bg:#0B1117;
  --tm-land:#18222B;
  --tm-land-2:#212C36;
  --tm-hair:#31404B;
  --tm-ink:#EFE7D8;
  --tm-ink-dim:#8FA0AC;
  --tm-rule:#22303A;
  --tm-panel:#101922;
  --tm-scrim:rgba(11,17,23,.82);

  --tm-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --tm-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tm-bo:'Monlam Uni OuChan2','Noto Serif Tibetan','Kailasa','Microsoft Himalaya',serif;

  --tm-radius:2px;
  --tm-max:1180px;

  box-sizing:border-box;
  width:100%;
  max-width:var(--tm-max);
  margin:0 auto;
  background:var(--tm-bg);
  color:var(--tm-ink);
  font-family:var(--tm-ui);
  font-size:15px;
  line-height:1.55;
  border:1px solid var(--tm-rule);
  border-radius:var(--tm-radius);
  overflow:hidden;
  container-type:inline-size;
}
.tibmap *,.tibmap *::before,.tibmap *::after{box-sizing:border-box;}

.tibmap[data-theme="light"]{
  --tm-utsang:#A6303F;
  --tm-kham:#2A6182;
  --tm-amdo:#347C5B;
  --tm-gold:#A87A18;
  --tm-water:#12628F;
  /* The crests are drawn over the region fills, and the fills do not invert
     between the themes -- only the land does.  So the dark theme's move, a tan
     lifted above everything under it, has no mirror here: a mid-brown picked
     against the pale land lands on the same luminance as madder and azurite and
     the spines disappear into them.  This is the rule the -lab inks below
     already follow, applied to the ink that draws the line: in this theme,
     clear of the region fills means under them. */
  --tm-relief:#2E2410;
  --tm-water-lab:#0A4664;
  --tm-relief-lab:#4A3A1E;
  --tm-bg:#F7F4EE;
  --tm-land:#E4DFD4;
  --tm-land-2:#D8D2C5;
  --tm-hair:#BDB6A6;
  --tm-ink:#1A1712;
  --tm-ink-dim:#6B6558;
  --tm-rule:#D2CBBC;
  --tm-panel:#FFFDF8;
  --tm-scrim:rgba(255,253,248,.86);
}

/* ── header ──────────────────────────────────────────────── */
.tibmap__head{padding:26px 28px 20px;border-bottom:1px solid var(--tm-rule);}
.tibmap__eyebrow{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--tm-gold);margin-bottom:10px;
}
.tibmap__eyebrow b{font-family:var(--tm-bo);font-size:17px;letter-spacing:0;font-weight:400;line-height:1;}
.tibmap__title{
  font-family:var(--tm-display);font-weight:600;
  font-size:clamp(26px,4.4cqw,40px);line-height:1.06;letter-spacing:-.015em;
  margin:0 0 8px;
}
.tibmap__standfirst{margin:0;max-width:62ch;color:var(--tm-ink-dim);font-size:14.5px;}

/* ── signature: the proportion bar / legend / selector ────── */
.tibmap__bar{display:flex;width:100%;margin-top:20px;gap:2px;}
.tibmap__seg{
  appearance:none;border:0;padding:0;cursor:pointer;text-align:left;
  background:transparent;color:inherit;font:inherit;
  display:block;position:relative;
  transition:opacity .25s ease;
}
.tibmap__seg:focus-visible{outline:2px solid var(--tm-gold);outline-offset:3px;}
/* The block keeps a constant 14px box and thickens by painting into it, so
   selecting or hovering a region never reflows the header and nudges the map. */
.tibmap__seg i{
  display:block;height:14px;background:var(--tm-c) top/100% 8px no-repeat;
  transition:background-size .25s ease,filter .25s ease;
}
.tibmap__seg:hover i,.tibmap__seg[aria-pressed="true"] i{background-size:100% 14px;}
.tibmap__seg u{
  display:block;text-decoration:none;padding-top:3px;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tibmap__seg s{
  display:block;text-decoration:none;
  font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--tm-ink-dim);
}
.tibmap[data-active]:not([data-active=""]) .tibmap__seg[aria-pressed="false"]{opacity:.4;}

/* ── body grid ───────────────────────────────────────────── */
.tibmap__body{display:grid;grid-template-columns:minmax(0,1fr) 316px;}
/* The controls are a third grid item, spanning the full width under the map and
   the panel. Once the panel drops below the map they would otherwise be the very
   last thing on the page, a whole panel's worth of scrolling away from the map
   they act on, so `order` lifts them to sit directly beneath it. */
.tibmap__body>.tibmap__foot{grid-column:1/-1;}
@container (max-width:900px){
  .tibmap__body{grid-template-columns:minmax(0,1fr);}
  .tibmap__stage{order:1;}
  .tibmap__body>.tibmap__foot{order:2;}
  .tibmap__panel{order:3;}
}

/* The SVG's own ratio sets the stage's natural height; when the panel beside it
   is taller, the stage stretches and the map fills that height instead of being
   letterboxed. `overflow:visible` lets the SVG paint the land and graticule that
   already exist outside the viewBox into the extra space, so there is never a
   blank band or a hard cut at the map's edge; the stage clips the sideways spill. */
.tibmap__stage{position:relative;background:var(--tm-bg);min-width:0;overflow:hidden;}
.tibmap__svg{display:block;width:100%;height:100%;overflow:visible;}
/* Which of the two type regimes is live. The breakpoint that decides it is a
   container query and belongs in this sheet; the script only reads the answer
   back off the SVG, so the width is never written down twice. */
.tibmap__svg{--tm-small:0;}

/* ── zoom and pan ────────────────────────────────────────── */
/* touch-action decides who gets the gesture. At fit zoom there is nothing to
   pan, so one finger scrolls the host page as it always did; once zoomed in,
   one finger pans the map instead. Two fingers always pinch, because the
   browser's own pinch-zoom is off in both states. */
.tibmap__svg{touch-action:pan-y;}
.tibmap[data-zoomed="true"] .tibmap__svg{touch-action:none;cursor:grab;}
.tibmap[data-panning="true"] .tibmap__svg{cursor:grabbing;}
.tibmap__stage:focus-visible{outline:2px solid var(--tm-gold);outline-offset:-2px;}

.tibmap__zoom{
  position:absolute;right:12px;bottom:12px;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.tibmap[data-zoom="false"] .tibmap__zoom{display:none;}
.tibmap__zbtn{
  appearance:none;width:30px;height:30px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--tm-scrim);border:1px solid var(--tm-rule);border-radius:var(--tm-radius);
  color:var(--tm-ink-dim);font:400 17px/1 var(--tm-ui);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tibmap__zbtn:hover:not(:disabled){color:var(--tm-gold);border-color:var(--tm-gold);}
.tibmap__zbtn:focus-visible{outline:2px solid var(--tm-gold);outline-offset:2px;}
.tibmap__zbtn:disabled{opacity:.38;cursor:default;}
.tibmap__zbtn[hidden]{display:none;}
.tibmap__zslot{
  width:30px;height:104px;display:flex;align-items:center;justify-content:center;
  background:var(--tm-scrim);border:1px solid var(--tm-rule);border-radius:var(--tm-radius);
}
/* A vertical range input is still not portable, so the slider is a horizontal
   one turned on its side -- which keeps the native control, and its keyboard. */
.tibmap__zrange{
  appearance:none;-webkit-appearance:none;background:transparent;
  width:92px;height:14px;margin:0;transform:rotate(-90deg);cursor:pointer;
}
.tibmap__zrange::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--tm-hair);}
.tibmap__zrange::-moz-range-track{height:3px;border-radius:2px;background:var(--tm-hair);}
.tibmap__zrange::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;margin-top:-4px;
  border:0;border-radius:50%;background:var(--tm-gold);
}
.tibmap__zrange::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--tm-gold);}
.tibmap__zrange:focus-visible{outline:2px solid var(--tm-gold);outline-offset:3px;}
/* The zoom column lies down on a small container, and the slider steps out of
   it.  Standing up it is some 190px tall, which on a phone is two thirds of the
   map's height in a strip down the eastern edge -- and the eastern edge is
   where the map is busiest: Dartsedo is set eastward off a dot near the right
   margin, and at a size anyone can read its tail ran in behind the column.  A
   row of three buttons in the corner is 30px tall and clears every name; the
   slider is the one control a phone does not need, since pinch zooms and the
   buttons step, and it is the whole of the column's height. */
@container (max-width:760px){
  .tibmap__zoom{right:8px;bottom:8px;flex-direction:row;gap:6px;}
  .tibmap__zslot{display:none;}
}

/* ── map layers ──────────────────────────────────────────── */
.tibmap .tm-sea{fill:var(--tm-bg);}
.tibmap .tm-grat{fill:none;stroke:var(--tm-hair);stroke-width:.6;opacity:.35;}
.tibmap .tm-neigh{fill:var(--tm-land);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-china{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:1;stroke-linejoin:round;}
.tibmap .tm-neighline{fill:none;stroke:var(--tm-hair);stroke-width:1;}
.tibmap .tm-admin{fill:none;stroke:var(--tm-ink);stroke-opacity:.42;stroke-width:1.4;stroke-dasharray:7 5;}
.tibmap .tm-outline{fill:none;stroke:var(--tm-gold);stroke-width:2.4;stroke-linejoin:round;pointer-events:none;}
.tibmap .tm-regions{filter:url(#tmLift);}
.tibmap .tm-halo{fill:none;stroke:var(--tm-bg);stroke-width:9;stroke-linejoin:round;opacity:.85;pointer-events:none;}

.tibmap .tm-region{
  stroke:var(--tm-bg);stroke-width:1.2;stroke-linejoin:round;
  cursor:pointer;
  transition:filter .3s ease,opacity .3s ease;
}
.tibmap .tm-region:focus{outline:none;}
.tibmap .tm-region:focus-visible{stroke:var(--tm-gold);stroke-width:3;}
.tibmap .tm-utsang{fill:var(--tm-utsang);}
.tibmap .tm-kham{fill:var(--tm-kham);}
.tibmap .tm-amdo{fill:var(--tm-amdo);}
.tibmap .tm-tex{pointer-events:none;}

.tibmap[data-active]:not([data-active=""]) .tm-region:not(.is-on){opacity:.34;filter:saturate(.45);}
.tibmap .tm-region.is-on{filter:brightness(1.16);}

/* map typography */
.tibmap .tm-ctry{
  fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-weight:500;
  letter-spacing:.2em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:4px;
}
.tibmap .tm-k-C{font-size:21px;letter-spacing:.26em;opacity:.95;font-weight:600;}
.tibmap .tm-k-c{font-size:14px;opacity:.75;}
.tibmap .tm-k-p{font-size:15px;opacity:.6;font-style:italic;letter-spacing:.1em;
  font-family:var(--tm-display);text-transform:none;}
.tibmap .tm-rname{
  fill:var(--tm-ink);font-family:var(--tm-display);font-weight:600;font-size:34px;
  letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:rgba(0,0,0,.32);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rname{stroke:rgba(255,255,255,.45);}
.tibmap .tm-rbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:27px;text-anchor:middle;
  pointer-events:none;opacity:.9;
  paint-order:stroke;stroke:rgba(0,0,0,.3);stroke-width:4px;
}
.tibmap[data-theme="light"] .tm-rbo{stroke:rgba(255,255,255,.45);}
.tibmap .tm-city{fill:var(--tm-ink);}
.tibmap .tm-cityring{fill:none;stroke:var(--tm-ink);stroke-opacity:.55;}
.tibmap .tm-cname{
  fill:var(--tm-ink);font-family:var(--tm-ui);font-size:16px;font-weight:500;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.75;stroke-width:4px;
}
.tibmap .tm-cbo{
  fill:var(--tm-ink);font-family:var(--tm-bo);font-size:14px;opacity:.72;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.7;stroke-width:3.5px;
}
.tibmap[data-cities="false"] .tm-cities{display:none;}
.tibmap[data-admin="false"] .tm-adminlayer{display:none;}
.tibmap[data-labels="en"] .tm-bo-only{display:none;}
.tibmap[data-labels="bo"] .tm-en-only{display:none;}

/* ── panel ───────────────────────────────────────────────── */
.tibmap__panel{
  border-left:1px solid var(--tm-rule);background:var(--tm-panel);min-width:0;
}
/* --tm-panel-h is measured at runtime as the tallest of the four panels, so
   moving between regions never changes the widget's height. */
.tibmap__pbody{
  padding:24px 24px 22px;display:flex;flex-direction:column;gap:16px;
  min-height:var(--tm-panel-h,0px);
}
@container (max-width:900px){ .tibmap__panel{border-left:0;border-top:1px solid var(--tm-rule);} }

.tibmap__mark{width:34px;height:3px;background:var(--tm-c,var(--tm-gold));}
.tibmap__pname{font-family:var(--tm-display);font-size:27px;font-weight:600;line-height:1.1;margin:0;}
.tibmap__pbo{font-family:var(--tm-bo);font-size:20px;line-height:1.9;margin:2px 0 0;color:var(--tm-gold);}
.tibmap__pkicker{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tm-ink-dim);margin:0;
}
.tibmap__pdesc{margin:0;font-size:14px;color:var(--tm-ink);opacity:.88;}
.tibmap__facts{margin:0;padding:0;list-style:none;border-top:1px solid var(--tm-rule);}
.tibmap__facts li{
  display:flex;justify-content:space-between;gap:14px;
  padding:8px 0;border-bottom:1px solid var(--tm-rule);font-size:13px;
}
.tibmap__facts dt,.tibmap__facts span:first-child{color:var(--tm-ink-dim);letter-spacing:.04em;}
.tibmap__facts span:last-child{text-align:right;font-variant-numeric:tabular-nums;}
.tibmap__quote{
  margin:0;padding:14px 0 0;border-top:1px solid var(--tm-rule);
  font-family:var(--tm-display);font-size:15px;line-height:1.45;color:var(--tm-ink);opacity:.9;
}
.tibmap__quote cite{display:block;margin-top:7px;font:400 11px/1.4 var(--tm-ui);
  letter-spacing:.16em;text-transform:uppercase;color:var(--tm-ink-dim);font-style:normal;}

/* ── controls + note ─────────────────────────────────────── */
.tibmap__foot{
  border-top:1px solid var(--tm-rule);padding:14px 28px 20px;
  display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;
}
.tibmap__ctrl{
  appearance:none;background:transparent;border:1px solid var(--tm-rule);
  color:var(--tm-ink-dim);font:500 11px/1 var(--tm-ui);letter-spacing:.14em;text-transform:uppercase;
  padding:8px 12px;border-radius:var(--tm-radius);cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tibmap__ctrl:hover{color:var(--tm-ink);border-color:var(--tm-hair);}
.tibmap__ctrl[aria-pressed="true"],
.tibmap__ctrl[data-on="true"]{color:var(--tm-gold);border-color:var(--tm-gold);}
.tibmap__ctrl:focus-visible{outline:2px solid var(--tm-gold);outline-offset:2px;}
.tibmap__note{
  padding:0 28px 24px;margin:0;font-size:11.5px;line-height:1.65;
  color:var(--tm-ink-dim);max-width:88ch;
}
.tibmap__note b{color:var(--tm-ink);font-weight:500;}

.tibmap .tm-inset-frame{fill:var(--tm-bg);stroke:var(--tm-rule);stroke-width:1.5;}
.tibmap .tm-inset-world{fill:var(--tm-land-2);stroke:var(--tm-hair);stroke-width:.5;}
.tibmap .tm-inset-tib{fill:var(--tm-gold);stroke:var(--tm-gold);stroke-width:1.6;stroke-linejoin:round;}
.tibmap .tm-inset-ring{fill:none;stroke:var(--tm-gold);stroke-width:1.2;opacity:.85;}
.tibmap .tm-inset-cap{fill:var(--tm-ink-dim);font-family:var(--tm-ui);font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;}
.tibmap[data-inset="false"] .tm-insetlayer{display:none;}

.tibmap__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* Physical geography. Both layers are off by default: the map is about the
   three regions first, and rivers and ranges are context you opt into. */
.tibmap .tm-hydro,.tibmap .tm-relief{display:none;}
.tibmap[data-rivers="true"] .tm-hydro{display:block;}
.tibmap[data-ranges="true"] .tm-relief{display:block;}
/* The region fills are left at full strength: fading them made the plateau
   read as a different shape, which is not a trade worth making for contrast.
   The water carries its own instead. */
/* The region titles are left exactly as the map draws them. Fading them and
   sliding "Kham" aside made room for the gang names, but both changed how the
   map itself looks, which is not this layer's to do: a name that has to give
   way is the crest name, not the region's. */
.tibmap .tm-river{fill:none;stroke:var(--tm-water);stroke-width:1.2;opacity:.92;
  stroke-linecap:round;stroke-linejoin:round;}
.tibmap .tm-river.is-main{stroke-width:1.9;}
.tibmap .tm-lake{fill:var(--tm-water);fill-opacity:.8;stroke:var(--tm-water);stroke-width:.8;}
/* A crest line, thin and solid. It is deliberately not dashed: the map already
   uses dashes for present-day borders, and a wide soft band just read as a
   smudge over the land. */
.tibmap .tm-range.is-out{opacity:.22;}
.tibmap .tm-range{fill:none;stroke:var(--tm-relief);stroke-width:1.4;opacity:.6;
  stroke-linecap:round;stroke-linejoin:round;}
.tibmap .tm-peak{fill:var(--tm-relief);opacity:.9;}
/* Counter-scale.  The map's zoom is one scale() on .tm-zoom, so everything
   inside it grows together and zooming is a magnifying glass: no name that was
   not there before ever appears.  A label's anchor belongs to the world and
   should grow; its type and its offset are measured in line-heights and should
   not.  So every label hangs in a .tm-cs group that scales by 1/k, and the two
   cancel: boxes hold their size on screen while the separations between them
   grow with k.  New collisions therefore cannot appear as the reader zooms in,
   which is what lets the whole map be solved once, at fit zoom, at build time.
   At k=1 this is scale(1) and nothing already placed moves.

   The region titles are deliberately not in here.  They are display type drawn
   to be underlapped and are excluded from the collision set entirely, so no
   arrangement depends on their size, and they are the one thing on the map the
   labelling layer was asked to leave exactly as it is. */
/* --tm-mag is the second factor on the same group, and the only thing that
   changes the size of map type on a phone.  A name is unreadable there not
   because it is set too small but because the whole drawing is scaled down --
   the map is 1180 units wide and the glass is 390 -- and everything that was
   solved against the type, the halo widths, the line-height step under each
   Latin name, the gap a connector tick stops short by, was solved in those same
   units.  Magnifying the type alone would have pulled all of that apart, so the
   magnification goes on .tm-cs instead and lifts the entire typographic layer
   at once: every proportion inside it survives, and the anchors, the coastline
   and the region fills are untouched.  It is 1 on a wide container, so nothing
   below that breakpoint moves. */
.tibmap .tm-cs{transform:scale(calc(var(--tm-mag,1) / var(--tm-k,1)));}
/* A name that lost its place at fit zoom waits for the zoom that has room for
   it, and fades in there rather than appearing.  Which name that is was decided
   at build time and carried in DATA as `minK`; nothing is chosen here. */
.tibmap [data-mink]{transition:opacity .2s ease;}
.tibmap[data-gates="1"] [data-mink="1.5"],
.tibmap[data-gates="1"] [data-mink="3"],
.tibmap[data-gates="1.5"] [data-mink="3"]{opacity:0;pointer-events:none;}
.tibmap .tm-lead{stroke:var(--tm-relief-lab);stroke-width:.8;opacity:.5;}
.tibmap .tm-lead.is-water{stroke:var(--tm-water-lab);}
.tibmap .tm-hylab{fill:var(--tm-water-lab);font-family:var(--tm-ui);font-size:11px;
  font-style:italic;letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.88;stroke-width:4.5px;
  stroke-linejoin:round;}
.tibmap .tm-rglab{fill:var(--tm-relief-lab);font-family:var(--tm-ui);font-size:9.5px;
  font-weight:500;letter-spacing:.06em;text-anchor:middle;
  pointer-events:none;paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.88;
  stroke-width:4.5px;stroke-linejoin:round;}
.tibmap .tm-hybo,.tibmap .tm-rgbo,.tibmap .tm-pkbo{
  font-family:var(--tm-bo);letter-spacing:0;text-transform:none;font-style:normal;}
/* The Tibetan name sits a line below the Latin one, and moves up into its place
   when the Latin one is hidden. This rides on the wrapping .tm-boslot group and
   never on the <text>, so the run keeps its Tibetan shaping -- see bilabel().
   The step tracks the type size: the physical names were set smaller once the
   placer could see that in "both" mode each of them is a two-line block, and
   the line below has to come up with them. */
.tibmap .tm-boslot{transform:translateY(11px);}
.tibmap[data-labels="bo"] .tm-boslot{transform:none;}
.tibmap .tm-hybo{font-size:10.5px;}
.tibmap .tm-rgbo{font-size:10px;}
.tibmap .tm-pkbo{font-size:10px;}
.tibmap .tm-pklab{fill:var(--tm-relief-lab);font-family:var(--tm-ui);font-size:9.5px;
  letter-spacing:.02em;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--tm-bg);stroke-opacity:.88;stroke-width:4.5px;
  stroke-linejoin:round;}
/* ── small containers: bigger map type, less clutter ─────── */
/* This block used to set one larger size per name and leave it there, which was
   right for the container it was written against and wrong for every narrower
   one: the map is drawn in 1180 viewBox units and fitted to the stage, so a
   size in those units arrives on the glass multiplied by the stage's width over
   1180.  On a 700px container that is .59 and a 31-unit town name reads at 18px;
   on a 390px phone it is .33 and the same name reads at 10, and on a 320px one
   at 8.  The step was a constant and the shrinkage it had to answer was not.  So
   the sizes here are stated in the pixels they should reach the reader at and
   converted with --tm-px -- the user-units-per-CSS-pixel the script measures off
   the SVG's own screen matrix -- which holds them at that size on any phone,
   while the floors keep the widest containers this block covers looking exactly
   as they did.

   And it comes last on purpose.  A container query carries no specificity of
   its own, so every rule in it is settled by source order against the plain
   rules above -- and where the block used to sit, halfway up the sheet, the
   physical names were styled below it and quietly beat the sizes it set for
   them.  The rivers and the ranges were at their desktop type on a phone, which
   is why they were the worst of it: eleven units, three pixels and a half. */
@container (max-width:760px){
  .tibmap__svg{
    --tm-small:1;
    /* The region titles, sized in the world rather than in the type layer. */
    --tm-rn:max(60px, calc(24px * var(--tm-px,1)));
    --tm-rbn:max(50px, calc(20px * var(--tm-px,1)));
  }
  .tibmap__head{padding:20px 18px 16px;}
  .tibmap__foot{padding:12px 18px 16px;gap:8px 14px;}
  .tibmap__note{padding:0 18px 20px;}
  .tibmap__pbody{padding:20px 18px;}
  .tibmap__seg s{display:none;}
  .tibmap__seg u{font-size:10.5px;letter-spacing:.1em;}
  /* The titles are display type and are deliberately outside .tm-cs, so they do
     not take --tm-mag and are measured here instead.  The Tibetan line's step
     has to track the Latin one's size or the two collide once it grows: 30 of
     those units are already on its y attribute and the remainder rides here. */
  .tibmap .tm-rname{font-size:var(--tm-rn);stroke-width:calc(var(--tm-rn) * .115);}
  .tibmap .tm-rbo{font-size:var(--tm-rbn);stroke-width:calc(var(--tm-rn) * .115);
    transform:translateY(calc(var(--tm-rn) * .93 - 30px));}
  /* Everything else on the map is inside .tm-cs and has already been magnified
     as one block by --tm-mag.  What is left to say here is only where the
     hierarchy itself differs on a phone: the neighbours' names step back, being
     context rather than content, and the tracking comes in with them so that
     PAKISTAN, which is set near the western edge, still fits on the map ... */
  .tibmap .tm-k-C{font-size:13px;letter-spacing:.08em;}
  .tibmap .tm-k-c{display:none;}
  .tibmap .tm-k-p{display:none;}
  /* ... and the physical names close most of the gap the desktop sheet leaves
     between them and the water, since down here the difference between reading
     a name and deciphering it is worth more than the rank the smaller size was
     expressing.  They stay under the towns: a river is context for a place. */
  .tibmap .tm-hylab{font-size:12px;font-weight:500;}
  .tibmap .tm-rglab,.tibmap .tm-pklab{font-size:11px;letter-spacing:.05em;}
  .tibmap .tm-hybo{font-size:12px;}
  .tibmap .tm-rgbo,.tibmap .tm-pkbo{font-size:10.5px;}
  /* Contrast, where the name is the thing standing on a saturated fill: the
     halo widths themselves need no help, being inside .tm-cs and magnified with
     the type they surround. */
  .tibmap .tm-cname{font-weight:600;stroke-opacity:.92;}
  .tibmap .tm-ctry{stroke-opacity:.85;}
  /* Two names to a feature is a luxury of a wide map.  At this size the second
     line is the whole difference between a legible map and a crowded one, so
     Both shows the Latin name alone -- which is what the town names have always
     done here -- and Tibetan keeps a mode of its own, whole and at full size,
     where it is the name rather than a gloss under one. */
  .tibmap[data-labels="both"] .tm-cbo,
  .tibmap[data-labels="both"] .tm-hybo,
  .tibmap[data-labels="both"] .tm-rgbo,
  .tibmap[data-labels="both"] .tm-pkbo{display:none;}
  /* With both physical layers up at once there are twenty-nine names on a map
     the size of a postcard, and no type size answers that: large enough to read
     is large enough to collide.  The map already has the move for a name with
     nowhere to go -- it waits for the zoom that has room and fades in there --
     so at this width the crests hand their names to that zoom while the water
     keeps its own.  Ranges on their own are unaffected: it is the pair that has
     no room, and a reader who wants the crests named has a mode that names them. */
  .tibmap .tm-relief [data-feat],.tibmap .tm-relief .tm-lead{transition:opacity .2s ease;}
  .tibmap[data-rivers="true"][data-ranges="true"][data-gates="1"] .tm-relief [data-feat],
  .tibmap[data-rivers="true"][data-ranges="true"][data-gates="1"] .tm-relief .tm-lead{
    opacity:0;pointer-events:none;}
  /* The locator inset is the one piece of the map that goes away at this width:
     a postcard has no corner to spare for a second map.  Its button goes with
     it, on the same rule, so the control bar never offers a toggle for
     something that is not on the map to toggle. */
  .tibmap .tm-insetlayer,
  .tibmap [data-act="inset"]{display:none;}
  /* The dot is geography and does not take --tm-mag, but it is read as part of
     the name beside it, so it grows on the same measure rather than staying the
     size it was when that name was half as tall. */
  .tibmap .tm-city{r:max(6px, calc(2px * var(--tm-px,1)));}
  .tibmap .tm-cityring{r:max(13px, calc(4.4px * var(--tm-px,1)));
    stroke-width:max(2px, calc(.75px * var(--tm-px,1)));}
  .tibmap .tm-cityitem[data-key="0"]{display:none;}

  var panel=root.querySelector('.tibmap__pbody');

  /* ── zoom and pan ────────────────────────────────────
     The map is moved by a transform on one <g> rather than by rewriting the
     viewBox, so the sea rect and the locator inset can stay outside it: the
     background is always painted and the inset stays pinned to its corner.
     getScreenCTM() does the screen-to-user conversion, which keeps the
     arithmetic right whatever preserveAspectRatio does with a stage taller
     than the map itself. */
  var Z_MIN=1, Z_MAX=8, Z_STEP=1.5;

  function r3(n){ return Math.round(n*1000)/1000; }

  function zApply(){
    /* Never let the map be dragged off its own frame: the content, scaled,

    if(zk<=Z_MIN){ zk=Z_MIN; zx=0; zy=0; }

      zy=Math.min(0,Math.max(H*(1-zk),zy));

       fresh solve. */

     be lifted to answer for it.  getScreenCTM() is asked rather than the stage's
     width because it is the one number that is already right whatever
     preserveAspectRatio has done with a stage taller than the map -- the same
     reason the pan arithmetic goes through it.  --tm-px is the measurement and
     nothing more; the sheet decides what to do with it, and says through
     --tm-small which of its two regimes is live, so the breakpoint stays a
     container query and is not written down a second time here.

  if(root.getAttribute('data-theme')==='auto'){
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    var apply=function(){root.setAttribute('data-theme',mq.matches?'light':'dark');};
    apply(); mq.addEventListener?mq.addEventListener('change',apply):mq.addListener(apply);
  }
  if(!root.hasAttribute('data-inset')) root.setAttribute('data-inset','true');
  root.querySelector('[data-act="inset"]').setAttribute('aria-pressed',root.getAttribute('data-inset')!=='false');
  root.querySelector('[data-act="admin"]').setAttribute('aria-pressed',root.getAttribute('data-admin')==='true');
  root.querySelector('[data-act="cities"]').setAttribute('aria-pressed',root.getAttribute('data-cities')!=='false');
  root.querySelector('[data-act="labels"]').textContent='Labels: '+(LABEL_TEXT[root.getAttribute('data-labels')]||'Both');
  setPhys(physMode());
  zApply();
  measureType();
  reservePanel();
  select(root.getAttribute('data-selected')||'');

  /* One pass for both: the type's measure and the panel's reservation are the
     two things that only a laid-out widget can answer, and both change for the
     same reason -- the widget got wider or narrower. */
  function remeasure(){ measureType(); reservePanel(); }
  if(window.ResizeObserver) new ResizeObserver(remeasure).observe(root);
  else window.addEventListener('resize',remeasure);
  /* Web fonts change the text metrics, so measure again once they are in. */
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(function(){reservedFor=-1;reservePanel();});
  }

  window.TibetMap={
    select:select,
    get:function(){return root.getAttribute('data-selected')||null;},
    on:function(fn){listeners.push(fn);return this;},
    setTheme:function(t){root.setAttribute('data-theme',t);},
    setZoom:function(k){zoomTo(+k);return this;},
    getZoom:function(){return zk;},
    resetView:function(){zoomTo(Z_MIN);return this;},
    regions:REGIONS,
    data:DATA
  };
})();
</script>

<script>
/* Report our height to a parent page, so an embedding iframe can size itself.
   Not part of the widget — safe to drop when pasting the block above inline. */
if (window.parent !== window && window.ResizeObserver) {
  new ResizeObserver(function () {
    parent.postMessage({ tibmapHeight: document.body.scrollHeight }, '*');
  }).observe(document.body);
}
